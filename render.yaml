# Render Blueprint — server ResQ (thư mục server/).
# KHÔNG ghi key / mật khẩu vào file này: repo công khai, ai cũng đọc được.
# Biến có `sync: false` → Render hỏi giá trị lúc tạo service (hoặc nhập ở Dashboard → Environment).
services:
  - type: web
    name: resq-server
    runtime: node
    plan: free
    rootDir: server
    # devDependencies (cloudflared, typescript…) chỉ dùng ở máy local
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Server chạy thẳng file .ts → cần Node >= 22.18 (bản 22.13 báo ERR_UNKNOWN_FILE_EXTENSION ".ts")
      - key: NODE_VERSION
        value: "24"
      - key: GOONG_API_KEY
        sync: false
      - key: GOONG_MAP_KEY
        sync: false
      # Mật khẩu cho các tài khoản mẫu (admin@resq.vn, khachhang@resq.vn, cuuho@resq.vn…) khi DB trống
      - key: RESQ_SEED_PASSWORD
        sync: false
      # Khóa ký phiên đăng nhập — Render tự sinh, giữ nguyên qua các lần deploy
      - key: RESQ_JWT_SECRET
        generateValue: true
    # ⚠ GÓI FREE: ổ đĩa TẠM — server ngủ (~15 phút không dùng) hoặc deploy lại là MẤT SẠCH tài khoản đăng ký, gara,
    # SOS. Muốn lưu lâu dài để quản lý trên admin: đổi `plan: starter` và BỎ dấu # ở khối dưới (Render Disk), rồi
    # deploy lại. Server tự để DB + ảnh + khóa phiên trong /var/data; admin hết cảnh báo "lưu trữ TẠM THỜI".
    # disk:
    #   name: resq-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (thêm 2 biến dưới vào envVars ở trên)
    #   - key: RESQ_DB_PATH
    #     value: /var/data/resq.db
    #   - key: RESQ_STORAGE
    #     value: persistent
